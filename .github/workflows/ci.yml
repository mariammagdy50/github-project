name: Calculator CI
on:
  push:
   branches:
    - main
    - master
    - feature-branch
jobs:
  test:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout repository
   uses: actions/checkout@v3
   - name: Set up Python
   uses: actions/setup-python@v4
   with:
     python-version: '3.10'
   - name: Run Calculator Test
     run: python test_calculator.py
